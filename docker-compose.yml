# docker-compose.yml  (Compose Spec; không dùng khoá "version")
# Chạy: xem infra/README.md.
# Bước 0: `bash scripts/gen-secrets.sh` (sinh ./secrets và .env).
name: acme

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-pyapp-env: &pyapp-env
  ACME_ENV: ${ACME_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://keycloak.acme.local:8080/realms/acme}
  METRICS_TOKEN_FILE: /run/secrets/metrics_token            # /metrics yêu cầu bearer (contracts §1)
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

networks:
  edge:   { driver: bridge }
  core:   { driver: bridge, internal: true }
  egress: { driver: bridge }              # chỉ gateway tham gia

volumes:
  pg_data: {}
  redis_state_data: {}
  prom_data: {}
  grafana_data: {}
  backups: {}

secrets:                                   # sinh bởi scripts/gen-secrets.sh (./secrets, gitignore)
  pg_superuser_password:   { file: ./secrets/pg_superuser_password }
  gw_owner_password:       { file: ./secrets/gw_owner_password }
  gw_app_password:         { file: ./secrets/gw_app_password }
  gw_database_url:         { file: ./secrets/gw_database_url }          # URL đầy đủ dựng từ gw_app_password (ghi chú 1)
  kn_owner_password:       { file: ./secrets/kn_owner_password }
  kn_app_password:         { file: ./secrets/kn_app_password }
  kn_ingest_password:      { file: ./secrets/kn_ingest_password }
  tk_owner_password:       { file: ./secrets/tk_owner_password }
  tk_app_password:         { file: ./secrets/tk_app_password }
  ag_app_password:         { file: ./secrets/ag_app_password }
  ag_owner_password:       { file: ./secrets/ag_owner_password }
  mcp_audit_password:      { file: ./secrets/mcp_audit_password }
  kc_app_password:         { file: ./secrets/kc_app_password }
  gw_report_password:      { file: ./secrets/gw_report_password }       # role đọc usage cho Grafana
  redis_tickets_password:  { file: ./secrets/redis_tickets_password }
  redis_docs_password:     { file: ./secrets/redis_docs_password }
  docs_gateway_key:        { file: ./secrets/docs_gateway_key }         # API key service cho docs-mcp -> gateway
  metrics_token:           { file: ./secrets/metrics_token }
  redis_ops_password:      { file: ./secrets/redis_ops_password }
  redis_health_password:   { file: ./secrets/redis_health_password }    # user chỉ có +ping
  gw_key_pepper:           { file: ./secrets/gw_key_pepper }            # >= 32 byte ngẫu nhiên
  gw_admin_token:          { file: ./secrets/gw_admin_token }
  anthropic_api_key:       { file: ./secrets/anthropic_api_key }
  kc_admin_password:       { file: ./secrets/kc_admin_password }
  kc_agent_client_secret:  { file: ./secrets/kc_agent_client_secret }
  bff_oidc_client_secret:  { file: ./secrets/bff_oidc_client_secret }   # secret của client Keycloak `chat-ui`
  bff_session_key:         { file: ./secrets/bff_session_key }          # 32 byte, AES-GCM mã hoá refresh token trong phiên
  redis_bff_password:      { file: ./secrets/redis_bff_password }
  agent_gateway_key:       { file: ./secrets/agent_gateway_key }        # API key của agent-service (tạo sau khi gateway chạy)
  approval_signer_private_key: { file: ./secrets/approval_es256_private.pem }   # CHỈ mount vào approval-signer
  approval_public_key:     { file: ./secrets/approval_es256_public.pem }        # mount vào tickets-mcp
  intent_private_key:      { file: ./secrets/intent_es256_private.pem }         # CHỈ mount vào tickets-mcp
  # intent_es256_public.pem: mount vào approval-signer qua bind ./secrets/intent-keys (INTENT_PUBLIC_KEYS_DIR)
  audit_hmac_key:          { file: ./secrets/audit_hmac_key }                   # >= 32 byte; khoá ngoài DB
  agent_checkpoint_key:    { file: ./secrets/agent_checkpoint_key }             # khoá mã hoá checkpoint LangGraph
  grafana_admin_password:  { file: ./secrets/grafana_admin_password }
  # URL đầy đủ (DSN/redis) dựng bởi gen-secrets.sh từ các mật khẩu ở trên; app đọc qua <BIẾN>_FILE
  docs_database_url:          { file: ./secrets/docs_database_url }          # role kn_app
  docs_audit_database_url:    { file: ./secrets/docs_audit_database_url }    # role mcp_audit_w @ knowledge
  docs_redis_url:             { file: ./secrets/docs_redis_url }
  tickets_database_url:       { file: ./secrets/tickets_database_url }       # role tk_app
  tickets_audit_database_url: { file: ./secrets/tickets_audit_database_url } # role mcp_audit_w @ tickets
  tickets_redis_url:          { file: ./secrets/tickets_redis_url }
  agent_database_url:         { file: ./secrets/agent_database_url }         # role ag_app

services:
  # ───────────── dữ liệu ─────────────
  postgres:
    image: pgvector/pgvector:pg17
    <<: *hardened
    read_only: false                        # PGDATA ghi nhiều; giữ volume riêng
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # entrypoint chuyển quyền sang user postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    command: >
      postgres -c hba_file=/etc/postgresql/pg_hba.conf
               -c password_encryption=scram-sha-256
               -c shared_buffers=256MB -c max_connections=200
               -c log_connections=on -c log_min_duration_statement=500
    secrets: [pg_superuser_password, gw_owner_password, gw_app_password, kn_owner_password, kn_app_password,
              kn_ingest_password, tk_owner_password, tk_app_password,
              ag_app_password, ag_owner_password, mcp_audit_password, kc_app_password, gw_report_password]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - backups:/backups
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    deploy: { resources: { limits: { cpus: "2", memory: 1g } } }

  redis-state:
    image: redis:8
    <<: *hardened
    user: "999:999"                         # cap_drop ALL => root không có DAC_OVERRIDE; chạy thẳng user redis
    entrypoint: ["/bin/sh", "/etc/redis/entrypoint.sh"]       # render users.acl từ secret
    command: ["redis-server", "/etc/redis/redis-state.conf"]
    secrets: [redis_tickets_password, redis_docs_password, redis_bff_password, redis_ops_password, redis_health_password]
    volumes:
      - redis_state_data:/data
      - ./infra/redis/redis-state.conf:/etc/redis/redis-state.conf:ro
      - ./infra/redis/users-state.acl.tmpl:/etc/redis/users.acl.tmpl:ro
      - ./infra/redis/entrypoint.sh:/etc/redis/entrypoint.sh:ro
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_health_password) redis-cli --user health ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { cpus: "0.5", memory: 384m } } }

  # ───────────── danh tính ─────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1   # 26.8.1 vá CVE-2026-97846
    <<: *hardened
    read_only: false                        # dev mode ghi vào /opt/keycloak/data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export KC_DB_PASSWORD="$$(cat /run/secrets/kc_app_password)"
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/kc_admin_password)"
        export AGENT_KC_CLIENT_SECRET="$$(cat /run/secrets/kc_agent_client_secret)"
        export BFF_OIDC_CLIENT_SECRET="$$(cat /run/secrets/bff_oidc_client_secret)"
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: kc_app
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HOSTNAME: http://keycloak.acme.local:8080           # issuer cố định, thống nhất trong và ngoài container (4.4)
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_FEATURES: token-exchange-standard                  # [cần xác minh] tên feature theo bản Keycloak (>= 26.2 mặc định đã bật)
    secrets: [kc_app_password, kc_admin_password, kc_agent_client_secret, bff_oidc_client_secret]
    volumes:
      - ./infra/keycloak/realm-acme.json:/opt/keycloak/data/import/realm-acme.json:ro
    ports: ["8080:8080"]
    networks:
      edge: { aliases: [keycloak.acme.local] }     # cùng issuer cho trình duyệt (qua hosts) và container
      core: { aliases: [keycloak.acme.local] }
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:                             # image không có curl → /dev/tcp tới management port 9000
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy: { resources: { limits: { cpus: "1.5", memory: 1g } } }

  # ───────────── migration job ─────────────
  migrate:
    build: { context: ., dockerfile: Dockerfile, target: migrate }
    image: acme/migrate:dev
    <<: *hardened
    restart: "no"
    environment:
      <<: *pyapp-env
      PG_HOST: postgres                      # URL dựng trong entrypoint từ các secret *_owner_password
      AGENT_OWNER_PASSWORD_FILE: /run/secrets/ag_owner_password   # agent.migrate: setup() checkpointer bằng ag_owner
    secrets: [gw_owner_password, kn_owner_password, tk_owner_password, ag_owner_password, metrics_token]
    networks: [core]
    depends_on:
      postgres: { condition: service_healthy }

  # Migration schema DB knowledge (rag-citations §2.3): dùng chính image Postgres đã pin để có psql; runner là infra/postgres/migrate.sh
  knowledge-migrate:
    image: pgvector/pgvector:pg17
    <<: *hardened
    restart: "no"
    user: "999:999"                          # uid postgres trong image; psql không cần quyền đặc biệt
    entrypoint: ["bash", "/migrate/migrate.sh", "up"]
    environment:
      PGHOST: postgres
      PGDATABASE: knowledge
      PGUSER: kn_owner
      KN_OWNER_PASSWORD_FILE: /run/secrets/kn_owner_password
      EMBED_DIM: ${EMBED_DIM:-1024}
      MIGRATE_FORCE_REEMBED: ${MIGRATE_FORCE_REEMBED:-0}
    secrets: [kn_owner_password]
    volumes:
      - ./infra/postgres/migrate.sh:/migrate/migrate.sh:ro
      - ./infra/postgres/migrations:/migrate/migrations:ro
    networks: [core]
    depends_on:
      postgres: { condition: service_healthy }

  # ───────────── gateway ─────────────
  gateway:
    build: { context: ., dockerfile: Dockerfile, target: gateway }
    image: acme/gateway:dev
    <<: *hardened
    environment:
      <<: *pyapp-env
      GW_DATABASE_URL_FILE: /run/secrets/gw_database_url       # URL dựng từ gw_app_password (ghi chú 1)
      EVENT_SINK_ADAPTER: postgres                              # usage_events + audit_log vào DB gateway (mặc định json_log chỉ ra stdout)
      EVENT_SINK_DATABASE_URL_FILE: /run/secrets/gw_database_url  # role gw_app (INSERT usage_events, audit_log)
      GW_KEY_PEPPER_FILE: /run/secrets/gw_key_pepper
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      GW_PROVIDER_OVERRIDE: ${GW_PROVIDER_OVERRIDE:-mock}      # mặc định mock (chưa có khoá provider thật); factory chọn adapter `mock` (contracts §9.1 mục 5)
      AUDIT_HMAC_KEY_FILE: /run/secrets/audit_hmac_key          # khoá ngoài DB
      AUDIT_HMAC_KEY_ID: ${AUDIT_HMAC_KEY_ID:-1}
    secrets: [gw_app_password, gw_database_url, gw_key_pepper, anthropic_api_key, audit_hmac_key, metrics_token]
    ports: ["8000:8000"]                      # dev; publish được vì gateway có mặt ở network egress (non-internal)
    networks: [core, egress]
    depends_on:
      postgres:    { condition: service_healthy }
      redis-state: { condition: service_healthy }
      migrate:     { condition: service_completed_successfully }
      keycloak:    { condition: service_healthy }
      mock-provider: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    deploy: { resources: { limits: { cpus: "1", memory: 1g } } }

  # ───────────── approval signer ─────────────
  approval-signer:
    profiles: ["tickets"]                       # R0: luồng ticket đóng băng, chỉ chạy với --profile tickets
    build: { context: ., dockerfile: Dockerfile, target: approval_signer }
    image: acme/approval-signer:dev
    <<: *hardened
    environment:
      <<: *pyapp-env
      SIGNER_PORT: "8310"
      SIGNER_AUDIENCE: approval-signer
      SIGNER_ALLOWED_AZP: chat-ui                 # BFF dùng client chat-ui; không có client bff
      APPROVAL_SIGNER_PRIVATE_KEY_PATH: /run/secrets/approval_signer_private_key
      APPROVAL_SIGNER_KEY_ID: ${APPROVAL_SIGNER_KEY_ID:-ap-1}
      INTENT_PUBLIC_KEYS_DIR: /run/intent-keys    # public key intent của tickets-mcp, read-only
      APPROVAL_TTL_S: "120"
    secrets:
      - metrics_token
      - approval_signer_private_key
    volumes:
      - ./secrets/intent-keys:/run/intent-keys:ro   # gen-secrets.sh đặt tickets-mcp-1.pem (bind mount thay vì `target:` ngoài /run/secrets)
    networks: [core]                              # KHÔNG egress, KHÔNG Redis, KHÔNG DB
    depends_on:
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8310/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 15
    deploy: { resources: { limits: { cpus: "0.25", memory: 128m } } }

  mock-provider:
    build: { context: ., dockerfile: Dockerfile, target: mock_provider }
    image: acme/mock-provider:dev
    <<: *hardened
    environment:
      <<: *pyapp-env
      MOCK_TTFT_MS: ${MOCK_TTFT_MS:-300}
      MOCK_TOKENS_PER_SEC: ${MOCK_TOKENS_PER_SEC:-50}
      MOCK_OUTPUT_TOKENS: ${MOCK_OUTPUT_TOKENS:-50}
      MOCK_CONTROL_TOKEN_FILE: /run/secrets/gw_admin_token     # API chaos /__control
    secrets: [gw_admin_token, metrics_token]
    networks: [core]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8900/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { cpus: "1", memory: 256m } } }

  # ───────────── MCP servers ─────────────
  docs-mcp:
    build: { context: ., dockerfile: Dockerfile, target: mcp_docs }
    image: acme/mcp-docs:dev
    <<: *hardened
    environment:
      <<: *pyapp-env
      MCP_AUDIENCE: docs-mcp
      MCP_ALLOWED_HOSTS: "docs-mcp:8101,localhost:8101,127.0.0.1:8101"   # chống DNS rebinding của SDK MCP; thiếu thì Host nội bộ bị 421
      MCP_DATABASE_URL_FILE: /run/secrets/docs_database_url   # role kn_app (SELECT)
      MCP_AUDIT_DATABASE_URL_FILE: /run/secrets/docs_audit_database_url
      MCP_REDIS_URL_FILE: /run/secrets/docs_redis_url
      DOCS_GATEWAY_URL: http://gateway:8000/v1                 # embedding qua gateway (alias acme-embed)
      DOCS_EMBEDDER: ${DOCS_EMBEDDER:-gateway_http}
      DOCS_USE_VECTOR: ${DOCS_USE_VECTOR:-true}
      DOCS_USE_FTS: ${DOCS_USE_FTS:-true}                      # nhánh Postgres FTS (không phải BM25)
      DOCS_FTS_MODE: ${DOCS_FTS_MODE:-unaccent}                # unaccent | segmented
      DOCS_RRF_K: ${DOCS_RRF_K:-60}
      DOCS_DIRECT_LOOKUP: ${DOCS_DIRECT_LOOKUP:-off}           # off | pin
      DOCS_GATEWAY_KEY_FILE: /run/secrets/docs_gateway_key     # key owner_type=service
      MCP_HOST: ${MCP_HOST:-mcp_sdk}
      MCP_PORT: "8101"
      DOCS_EMBED_DIM: ${EMBED_DIM:-1024}                       # cùng giá trị với knowledge-migrate
      AUDIT_HMAC_KEY_FILE: /run/secrets/audit_hmac_key
    secrets: [docs_database_url, docs_audit_database_url, docs_redis_url, docs_gateway_key, audit_hmac_key, metrics_token]
    networks: [core]
    depends_on:
      postgres:    { condition: service_healthy }
      redis-state: { condition: service_healthy }
      gateway:     { condition: service_healthy }
      migrate:     { condition: service_completed_successfully }
      knowledge-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8101/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { cpus: "0.5", memory: 512m } } }

  tickets-mcp:
    profiles: ["tickets"]                       # R0: luồng ticket đóng băng, chỉ chạy với --profile tickets
    build: { context: ., dockerfile: Dockerfile, target: mcp_tickets }
    image: acme/mcp-tickets:dev
    <<: *hardened
    environment:
      <<: *pyapp-env
      MCP_AUDIENCE: tickets-mcp
      MCP_ALLOWED_HOSTS: "tickets-mcp:8102,localhost:8102,127.0.0.1:8102"   # chống DNS rebinding của SDK MCP; thiếu thì Host nội bộ bị 421
      MCP_DATABASE_URL_FILE: /run/secrets/tickets_database_url
      MCP_AUDIT_DATABASE_URL_FILE: /run/secrets/tickets_audit_database_url
      MCP_REDIS_URL_FILE: /run/secrets/tickets_redis_url
      APPROVAL_PUBLIC_KEY_PATH: /run/secrets/approval_public_key     # verify approval token do approval-signer ký
      INTENT_PRIVATE_KEY_PATH: /run/secrets/intent_private_key       # ký intent JWS
      INTENT_KEY_ID: tickets-mcp-1                                    # = secrets/intent-keys/<kid>.pem do gen-secrets.sh tạo (cố định, không đọc .env)
      INTENT_TTL_S: "300"
      TAINT_POLICY: ${TAINT_POLICY:-warn}                            # warn|block
      AUDIT_HMAC_KEY_FILE: /run/secrets/audit_hmac_key
    secrets: [tickets_database_url, tickets_audit_database_url, tickets_redis_url, approval_public_key, intent_private_key, audit_hmac_key, metrics_token]
    networks: [core]
    depends_on:
      postgres:    { condition: service_healthy }
      redis-state: { condition: service_healthy }
      migrate:     { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8102/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { cpus: "0.5", memory: 512m } } }

  # ───────────── agent + bff ─────────────
  agent:
    build: { context: ., dockerfile: Dockerfile, target: agent }
    image: acme/agent:dev
    <<: *hardened
    environment:
      <<: *pyapp-env
      AGENT_GATEWAY_URL: http://gateway:8000/v1
      AGENT_GATEWAY_KEY_FILE: /run/secrets/agent_gateway_key
      AGENT_KC_CLIENT_SECRET_FILE: /run/secrets/kc_agent_client_secret
      AGENT_DATABASE_URL_FILE: /run/secrets/agent_database_url
      MCP_DOCS_URL: http://docs-mcp:8101/mcp
      MCP_TICKETS_URL: http://tickets-mcp:8102/mcp
      AGENT_CHECKPOINT_ENCRYPTION_KEY_FILE: /run/secrets/agent_checkpoint_key   # checkpoint mã hoá mặc định
      AGENT_THREAD_RETENTION_DAYS: "30"
    secrets: [agent_gateway_key, kc_agent_client_secret, agent_database_url, agent_checkpoint_key, metrics_token]
    networks: [core]                           # KHÔNG có egress
    depends_on:
      postgres:      { condition: service_healthy }
      gateway:       { condition: service_healthy }
      keycloak:      { condition: service_healthy }
      docs-mcp:      { condition: service_healthy }
      tickets-mcp:   { condition: service_healthy, required: false }   # profile `tickets` tắt thì bỏ qua; bật thì agent chờ tickets-mcp khoẻ (agent cũng tự dò lại định kỳ)
      migrate:       { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8200/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 15
    deploy: { resources: { limits: { cpus: "1", memory: 1g } } }

  bff:                                          # thay `ui` (Chainlit đã bỏ)
    build: { context: ., dockerfile: Dockerfile, target: bff }   # multi-stage: node build web/ -> python runtime phục vụ static
    image: acme/bff:dev
    <<: *hardened
    environment:
      <<: *pyapp-env
      BFF_PUBLIC_URL: http://localhost:8300
      BFF_OIDC_CLIENT_SECRET_FILE: /run/secrets/bff_oidc_client_secret
      BFF_SESSION_KEY_FILE: /run/secrets/bff_session_key
      BFF_REDIS_URL: redis://bff@redis-state:6379/0             # ACL user `bff` chỉ ~bff:sess:*
      REDIS_BFF_PASSWORD_FILE: /run/secrets/redis_bff_password
      BFF_SESSION_IDLE_S: "1800"                                # idle 30 phút
      BFF_SESSION_ABS_S: "28800"                                # tuyệt đối 8 giờ
      BFF_SIGNER_TOKEN_TTL_S: "300"                             # token signer ≤ 5 phút
      BFF_REJECTED_TTL_S: "600"
      BFF_MAX_CARDS_PER_THREAD_HOUR: "10"                       # vượt => 429 rate_limited
      BFF_AGENT_URL: http://agent:8200
      BFF_SIGNER_URL: http://approval-signer:8310               # BFF KHÔNG giữ khoá ký
    secrets: [bff_oidc_client_secret, bff_session_key, redis_bff_password, metrics_token]
    ports: ["8300:8300"]
    networks: [edge, core]
    depends_on:
      agent:    { condition: service_healthy }
      keycloak: { condition: service_healthy }
      redis-state: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8300/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 15
    deploy: { resources: { limits: { cpus: "0.5", memory: 512m } } }

  # ───────────── quan sát ─────────────
  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v3.5.0
    <<: *hardened
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prom_data:/prometheus
    networks: [core, edge]                     # contracts v1.1: core + edge (dev) để publish 9090
    ports: ["9090:9090"]                       # dev; scrape /metrics bằng bearer METRICS_TOKEN
    secrets: [metrics_token]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { cpus: "0.5", memory: 512m } } }

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:12.2.0
    <<: *hardened
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # mật khẩu gw_report nạp trong provisioning datasource bằng $__file{/run/secrets/gw_report_password}
    secrets: [grafana_admin_password, gw_report_password]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    networks: [edge, core]
    depends_on:
      prometheus: { condition: service_healthy }
      postgres:   { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { cpus: "0.5", memory: 256m } } }
