# infra/redis/redis-cache.conf  (docs/design/04 §2.4)
# LƯU Ý: không comment cuối dòng trong redis.conf.

bind 0.0.0.0
port 6379
protected-mode yes
tcp-keepalive 60
databases 1

maxmemory 512mb
maxmemory-policy allkeys-lru
# LRU chính xác hơn, đánh đổi chút CPU
maxmemory-samples 10
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

appendonly no
# không persistence
save ""

aclfile /tmp/users.acl
# TODO spike M0 [cần xác minh]: rename-command ở Redis 8 (xem redis-state.conf). Xoá cache: script quản trị dùng SCAN theo prefix + FT.DROPINDEX.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command KEYS ""
rename-command SHUTDOWN ""
rename-command MODULE ""
slowlog-log-slower-than 10000
