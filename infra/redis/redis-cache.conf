# infra/redis/redis-cache.conf  (Q1: exact cache của gateway; cache-observability.md §1)
# LƯU Ý: redis.conf KHÔNG hỗ trợ comment cuối dòng; mọi comment ở dòng riêng.
# Nội dung cache là câu trả lời mật theo phạm vi người hỏi: không ghi đĩa, tự đẩy entry cũ, TTL do gateway đặt.

bind 0.0.0.0
port 6379
protected-mode yes
tcp-keepalive 60
databases 1

# --- bộ nhớ: đầy thì đẩy entry ít dùng nhất; cache không bao giờ chặn ghi ---
maxmemory 128mb
maxmemory-policy allkeys-lru
lazyfree-lazy-user-del yes
lazyfree-lazy-expire yes

# --- KHÔNG persistence: không AOF, không RDB (dữ liệu mật không nằm trên đĩa) ---
appendonly no
save ""
dir /data

# --- bảo mật ---
# render bởi entrypoint.sh (mật khẩu dạng SHA256)
aclfile /tmp/users.acl
acllog-max-len 256
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command KEYS ""
rename-command SHUTDOWN ""
rename-command MIGRATE ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""
rename-command MODULE ""

slowlog-log-slower-than 5000
slowlog-max-len 256
loglevel notice
