# infra/redis/redis-state.conf
# LƯU Ý: redis.conf KHÔNG hỗ trợ comment cuối dòng; mọi comment ở dòng riêng.

bind 0.0.0.0
port 6379
# chỉ mạng core nội bộ
protected-mode yes
tcp-keepalive 60
databases 1

# --- bộ nhớ ---
maxmemory 256mb
# đầy -> ghi lỗi OOM; client phải đóng an toàn khi Redis lỗi
maxmemory-policy noeviction
lazyfree-lazy-user-del yes
lazyfree-lazy-expire yes

# --- bền vững: chỉ AOF ---
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 32mb
# tắt RDB snapshot định kỳ
save ""
dir /data

# --- bảo mật ---
# render bởi entrypoint.sh (mật khẩu dạng SHA256)
aclfile /tmp/users.acl
acllog-max-len 256
# Defence in depth ngoài ACL (user default đã off, không user nào có @dangerous).
# Cần xác minh: rename-command còn được Redis 8 hỗ trợ (deprecated). Nếu redis-server
# báo lỗi cấu hình ở các dòng dưới thì XOÁ chúng; ACL vẫn đủ.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command KEYS ""
rename-command SHUTDOWN ""
rename-command MIGRATE ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""
rename-command MODULE ""

# --- chẩn đoán ---
slowlog-log-slower-than 5000
slowlog-max-len 256
latency-monitor-threshold 50
loglevel notice
