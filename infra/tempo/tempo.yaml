# Tempo một tiến trình (cache-observability.md §2). Nhận OTLP/HTTP từ service, lưu local, giữ 24 giờ.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 24h
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
