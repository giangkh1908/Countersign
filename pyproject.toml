[project]
name = "acme-workspace"
version = "0.0.0"
description = "AI_EXAMPLE uv workspace (virtual root, không chứa code)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff mới format cả code block trong .md — docs/ là tài liệu thiết kế, không để tool tự sửa.
extend-exclude = ["docs", "web", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
# Độ dài dòng do `ruff format` quản lý; docstring dài (tiếng Việt, link docs) không chặn lint.
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages"]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
