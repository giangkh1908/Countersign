[project]
name = "acme-bff"
version = "0.1.0"
description = "BFF cho web UI (OIDC, phiên, proxy SSE tới agent)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "acme-common",
    "redis>=5",
    "httpx",
    "cryptography",
]

[tool.uv.sources]
acme-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bff"]

[dependency-groups]
dev = [
    "fakeredis>=2.26",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query"]
