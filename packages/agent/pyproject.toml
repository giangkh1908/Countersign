[project]
name = "acme-agent"
version = "0.1.0"
description = "Agent service (LangGraph điều phối, gọi MCP qua gateway)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "acme-common",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langchain-openai>=1.7.3",
    "pycryptodome>=4.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "mcp>=2.3,<2.4",
]
# langgraph + checkpointer postgres, client OpenAI-compatible, mcp client, sqlalchemy/psycopg

[tool.uv.sources]
acme-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
