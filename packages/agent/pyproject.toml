[project]
name = "acme-agent"
version = "0.1.0"
description = "Agent service (LangGraph điều phối, gọi MCP qua gateway)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "acme-common",
]
# M1: langgraph + checkpointer postgres, client OpenAI-compatible, mcp client, sqlalchemy/psycopg

[tool.uv.sources]
acme-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
