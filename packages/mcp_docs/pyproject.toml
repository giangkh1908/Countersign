[project]
name = "acme-mcp-docs"
version = "0.1.0"
description = "MCP server tra cứu tài liệu (RAG)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "acme-common",
]
# M1: mcp (SDK), sqlalchemy/psycopg, redis, pgvector, pdf/docx loader

[tool.uv.sources]
acme-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_docs"]
