[project]
name = "acme-mcp-docs"
version = "0.1.0"
description = "MCP server tra cứu tài liệu (RAG)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "acme-common",
    "psycopg[binary]>=3.2",
    "redis>=8.1.0",
]
# Chưa có: pdf/docx loader, bge_reranker

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.40.0",
]

[tool.uv.sources]
acme-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_docs"]
