[project]
name = "acme-mcp-tickets"
version = "0.1.0"
description = "MCP server ticket (đọc + ghi có phê duyệt)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "acme-common",
]
# M1: mcp (SDK), sqlalchemy/psycopg, redis, pyjwt + cryptography (ES256)

[tool.uv.sources]
acme-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tickets"]
