[project]
name = "acme-mcp-tickets"
version = "0.1.0"
description = "MCP server ticket (đọc + ghi có phê duyệt)"
requires-python = ">=3.12"
dependencies = [
    "uvicorn[standard]",
    "pydantic-settings",
    "acme-common",
    "redis>=8.1.0",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]",
    "cryptography",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.40.0",
]

[tool.uv.sources]
acme-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tickets"]
