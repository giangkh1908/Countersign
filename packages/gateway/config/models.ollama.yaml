# Cấu hình embedding chạy local (runtime OpenAI-compatible trên máy host). Chọn bằng GW_MODELS_CONFIG.
# Chỉ đổi block embedding; các alias chat giữ như models.yaml.
# Gateway trong container tới host qua host.docker.internal (extra_hosts trong docker-compose.yml).
default_max_output: 4096
aliases:
  acme-fast:  { chain: [anthropic/claude-haiku-5-5], timeout_s: 30 }
  acme-smart: { chain: [anthropic/claude-sonnet-5-5], timeout_s: 90 }
  # Judge kiểm chứng trích dẫn (R2): cùng chain với acme-fast cho đến khi hiệu chuẩn chọn model riêng.
  acme-judge: { chain: [anthropic/claude-haiku-5-5], timeout_s: 30 }
  acme-embed:
    kind: embedding
    adapter: openai_compatible
    base_url: http://host.docker.internal:11434/v1
    model: bge-m3
    dim: 1024
    # Lô 32 chunk tới 700 token trên GPU 4 GB mất hàng chục giây (lần đầu thêm thời gian nạp model).
    timeout_s: 180
    # Không thử lại khi timeout: runtime vẫn đang tính lô cũ, thử lại chỉ nhân đôi tải.
    max_attempts: 1
  # Rerank cross-encoder (R1, cấu hình hybrid+rerank): llama.cpp `llama-server --reranking` chạy trên host cổng 8081.
  # Chỉ có ở file này vì models.yaml mặc định không có runtime rerank.
  acme-rerank:
    kind: rerank
    adapter: http_rerank
    base_url: http://host.docker.internal:8081
    model: bge-reranker-v2-m3
    timeout_s: 60
    max_attempts: 1
