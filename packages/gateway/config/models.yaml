# Alias model của gateway (contracts §8). Đây là file DUY NHẤT người dùng cần sửa để đổi model.
# Chat qua OpenRouter (chain `openrouter/<vendor>/<model>`, cần secrets/openrouter_api_key); id lấy từ
# https://openrouter.ai/api/v1/models. Embedding và rerank cũng qua OpenRouter (cùng key), không cần runtime local.
# Test/CI dùng cấu hình mock riêng: packages/gateway/tests/models.test.yaml (GW_MODELS_CONFIG).
# Chỉ dùng phần tử đầu của `chain` (chưa có fallback).
default_max_output: 4096          # client không gửi max_tokens thì dùng giá trị này
aliases:
  # extra_body gửi thẳng tới provider: tắt reasoning của DeepSeek V4.1 Flash (đo: 537 -> 5 token, 3,8s -> 0,7s).
  acme-fast:  { chain: [openrouter/deepseek/deepseek-v4.1-flash], timeout_s: 30, extra_body: { reasoning: { enabled: false } } }
  acme-smart: { chain: [openrouter/deepseek/deepseek-v4.1-flash], timeout_s: 90, extra_body: { reasoning: { enabled: false } } }
  # Judge kiểm chứng trích dẫn (R2): cùng model với acme-fast cho đến khi hiệu chuẩn chọn model riêng.
  acme-judge: { chain: [openrouter/deepseek/deepseek-v4.1-flash], timeout_s: 30, extra_body: { reasoning: { enabled: false } } }
  # Embedding qua OpenRouter (POST {base_url}/embeddings, key GW_EMBEDDING_API_KEY_FILE = secrets/openrouter_api_key).
  # dim phải khớp EMBED_DIM / schema pgvector (1024). Đổi model thì chạy lại ingest (tự nạp lại, không cần --force).
  acme-embed:
    kind: embedding
    adapter: openai_compatible
    base_url: https://openrouter.ai/api/v1
    model: baai/bge-m3
    dim: 1024
    timeout_s: 60
  # Rerank cross-encoder (R1, tuỳ chọn) qua OpenRouter: POST {base_url}/v1/rerank (định dạng Cohere), cùng key.
  # Dùng khi DOCS_RERANK=gateway_rerank.
  acme-rerank:
    kind: rerank
    adapter: http_rerank
    base_url: https://openrouter.ai/api
    model: qwen/qwen3-reranker-8b
    timeout_s: 30
