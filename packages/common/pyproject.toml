[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acme-common"
version = "0.0.0"
description = "Thư viện dùng chung (ports, audit, testing, http)"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "httpx",
    "pyjwt[crypto]",
    # M2: thêm redis, sqlalchemy/psycopg khi triển khai adapter postgres_event_sink / redis_token_bucket.
]

[tool.hatch.build.targets.wheel]
packages = ["src/acme_common"]
